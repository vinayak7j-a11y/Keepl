<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Keepl Shop Login</title>

<link rel="stylesheet" href="/keepl.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<!-- ✅ Favicon -->
<link rel="icon" href="/icons/keepl-192.png">

<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FF6B00">

<style>
body {
  font-family: Arial, sans-serif;
  background: var(--k-bg);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
}

.subtitle {
  text-align: center;
  color: var(--k-ink-tertiary);
  font-size: 14px;
  margin-bottom: 24px;
}

.error {
  color: var(--k-danger);
  font-size: 14px;
  text-align: center;
  margin-top: 10px;
}

.register {
  text-align: center;
  margin-top: 20px;
  font-size: 14px;
  color: var(--k-ink-tertiary);
}

.register a {
  color: var(--k-saffron);
  text-decoration: none;
  font-weight: 500;
}

.register a:hover {
  text-decoration: underline;
}

.installBtn {
  margin-top: 10px;
  width: 100%;
  background: var(--k-teal);
  color: white;
  border: none;
  padding: 11px 20px;
  border-radius: var(--k-r-md);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const token = localStorage.getItem("token");
  const shopId = localStorage.getItem("shopId");

  if(token && shopId){
    window.location.href="/dashboard/"+shopId;
  }
});
</script>

</head>

<body>

<div class="k-auth-card" style="max-width:400px; width:100%;">

  <!-- Logo -->
  <div class="k-auth-logo" style="justify-content:center; margin-bottom:6px;">
    <div class="k-auth-logo-icon">
      <i class="ti ti-bolt"></i>
    </div>
    <div class="k-auth-logo-text">keep<span>l</span></div>
  </div>

  <p class="subtitle">Access your shop rewards dashboard</p>

  <!-- Error message -->
  <p id="errorMsg" class="error"></p>

  <form id="loginForm">

    <div class="k-form-group">
      <label class="k-label" for="phone">Phone number</label>
      <input
        class="k-input"
        id="phone"
        type="tel"
        placeholder="98765 43210"
        required
      />
    </div>

    <div class="k-form-group" style="margin-bottom:24px;">
      <label class="k-label" for="password">Password</label>
      <input
        class="k-input"
        id="password"
        type="password"
        placeholder="Your password"
        required
      />
    </div>

    <button id="loginBtn" type="submit" class="k-btn k-btn-primary k-btn-full k-btn-lg">
      <i class="ti ti-bolt"></i> Login to Dashboard
    </button>

  </form>

  <button id="installBtn" class="installBtn" style="display:none;">
    <i class="ti ti-download"></i> Install Keepl App
  </button>

  <div class="k-auth-divider"></div>

  <p class="register">
    Don't have a shop account?
    <a href="/register">Register Shop</a>
  </p>

</div>

<!-- LOGIN SCRIPT -->
<script>
const BASE_URL = "https://keepl.onrender.com";

const form = document.getElementById("loginForm");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value.trim();
  const errorMsg = document.getElementById("errorMsg");
  const btn = document.getElementById("loginBtn");

  errorMsg.innerText = "";

  if (!phone || !password) {
    errorMsg.innerText = "Please enter phone and password";
    return;
  }

  btn.disabled = true;
  btn.innerText = "Logging in...";

  try {
    const res = await fetch(`${BASE_URL}/api/shops/login`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ phone, password })
    });

    const data = await res.json();

    if (res.ok && data.shopId) {
      localStorage.setItem("token", data.token);
      localStorage.setItem("shopId", data.shopId);
      window.location.href = "/dashboard/" + data.shopId;
    } else {
      errorMsg.innerText = data.message || "Login failed";
    }

  } catch (err) {
    errorMsg.innerText = "Server error. Please try again.";
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-bolt"></i> Login to Dashboard';
});
</script>

<!-- PWA INSTALL PROMPT -->
<script>
let deferredPrompt;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;

  const btn = document.getElementById("installBtn");
  btn.style.display = "block";

  btn.onclick = async () => {
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    if(choice.outcome === "accepted"){
      btn.style.display = "none";
    }
  };
});
</script>

<!-- ✅ SERVICE WORKER REGISTRATION -->
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker
    .register("/sw.js")
    .then(() => console.log("✅ Service Worker registered"))
    .catch(err => console.log("SW failed:", err));
}
</script>

</body>
</html>
